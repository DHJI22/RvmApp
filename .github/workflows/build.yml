name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack RvmApp.zip
        run: |
          unzip -oq RvmApp.zip -d temp_extract
          if [ -d "temp_extract/RvmApp" ]; then
            cp -r temp_extract/RvmApp/* .
          else
            cp -r temp_extract/* .
          fi
          rm -rf temp_extract

      - name: Download RVM Model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          gh release download v1.0.0 -R PeterL1n/RobustVideoMatting -p "rvm_mobilenetv3_fp32.onnx" -D app/src/main/assets || \
          curl -fL "https://huggingface.co" -o app/src/main/assets/rvm_mobilenetv3_fp32.onnx
          ls -lh app/src/main/assets/rvm_mobilenetv3_fp32.onnx
          test $(stat -c%s app/src/main/assets/rvm_mobilenetv3_fp32.onnx) -gt 10000000

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
