name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack RvmApp.zip
        run: |
          unzip -q RvmApp.zip -d temp_extract
          if [ -d "temp_extract/RvmApp" ]; then
            cp -rn temp_extract/RvmApp/* .
          else
            cp -rn temp_extract/* .
          fi
          rm -rf temp_extract

      - name: Download RVM Model
        run: |
          mkdir -p app/src/main/assets
          curl -L https://github.com -o app/src/main/assets/rvm_mobilenetv3_fp32.onnx

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
